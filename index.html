<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Planner</title>
</head>

<body>
  <h1>Student Planner</h1>
  <p>Track your assignments and deadlines.</p>

  <input type="text" id="assignment" placeholder="Assignment name">
  <input type="date" id="deadline">

  <button onclick="addAssignment()">Add Assignment</button>

  <ul id="assignmentList"></ul>

<script>
  let assignments =
    JSON.parse(localStorage.getItem("assignments")) || [];

  function addAssignment() {
    const assignmentInput = document.getElementById("assignment");
    const deadlineInput = document.getElementById("deadline");

    const assignment = assignmentInput.value;
    const deadline = deadlineInput.value;

    if (assignment === "" || deadline === "") {
      alert("Please enter an assignment and deadline.");
      return;
    }

    assignments.push({
      assignment: assignment,
      deadline: deadline,
      completed: false
    });

    localStorage.setItem(
      "assignments",
      JSON.stringify(assignments)
    );

    assignmentInput.value = "";
    deadlineInput.value = "";

    displayAssignments();
  }


  function displayAssignments() {
    const assignmentList =
      document.getElementById("assignmentList");

    assignmentList.innerHTML = "";

    assignments.forEach(function(item, index) {

      const listItem = document.createElement("li");

      const assignmentText =
        document.createElement("span");

      assignmentText.textContent =
        item.assignment + " - " + item.deadline + " ";

      if (item.completed === true) {
        assignmentText.style.textDecoration = "line-through";
      }

      const completeButton =
        document.createElement("button");

      completeButton.textContent =
        item.completed ? "Undo" : "Complete";

    completeButton.onclick = function() {
      item.completed = !item.completed;
    
      localStorage.setItem(
        "assignments",
        JSON.stringify(assignments)
      );
    
      displayAssignments();
    };


      const deleteButton =
        document.createElement("button");

      deleteButton.textContent = "Delete";

      deleteButton.onclick = function() {
        assignments.splice(index, 1);

        localStorage.setItem(
          "assignments",
          JSON.stringify(assignments)
        );

        displayAssignments();
      };


      listItem.appendChild(assignmentText);
      listItem.appendChild(completeButton);
      listItem.appendChild(deleteButton);

      assignmentList.appendChild(listItem);
    });
  }


  displayAssignments();
</script>
</body>
</html>
